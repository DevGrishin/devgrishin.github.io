<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    :root {
      --bg: #fafafa;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #eaeaea;
        --muted: #9a9a9a;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 1.5rem;
    }
    main {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 1rem;
      letter-spacing: -0.02em;
    }
    h1::after {
      content: "";
      display: block;
      width: 56px;
      height: 4px;
      margin: 1rem auto 0;
      background: var(--accent);
      border-radius: 2px;
    }
    p {
      font-size: 1.125rem;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Portfolio</h1>
    <p>Hello my name is Grigory Grishin</p>
  </main>
</body>
</html>
